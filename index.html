<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <meta
      name="description"
      content="Generate unique, random and complexed password"
    />
    <meta name="keywords" content="HTML5 | CSS3 | JS" />
    <meta name="author" content="Muhammed Soliman" />
    <link
      rel="canonical"
      href="https://mohammed-soliman144.github.io/Password-Generator"
    />
    <link rel="stylesheet" href="./src/styles/globals.css" />
    <script defer src="./src/js/main.js"></script>
  </head>
  <body>
    <main class="main">
      <div class="container">
        <h1 class="main__main-heading" id="main-title">password generator</h1>
        <form class="main__form" aria-labelledby="main-title" novalidate>
          <div class="form-group">
            <label for="password" class="form__label sr-only">Password: </label>
            <input
              type="text"
              class="form__input input-text input"
              id="password"
              name="password"
              readonly
            />
            <div class="form-controls">
              <button
                type="button"
                class="form__button copy-button button"
                aria-label="Copy your generated password to clipboard"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  aria-hidden="true"
                  focusable="false"
                  class="button__icon copy-icon icon"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"
                  />
                </svg>
              </button>
            </div>
          </div>
          <fieldset class="form__fieldset form__checkbox-group checkbox-group">
            <legend class="form__legend sr-only">
              check password strength options
            </legend>
            <div class="form-group">
              <label for="pass-len" class="form__label">password length</label>
              <input
                id="pass-len"
                type="range"
                min="0"
                max="24"
                value="12"
                class="form__input input-range input"
                aria-describedby="len-value"
              />
              <output
                class="form__output output-range"
                id="len-value"
                for="pass-len"
                class="form__badge-output"
                >12</output
              >
            </div>
            <div class="form-group">
              <label for="upper-check">include uppercase</label>
              <input
                type="checkbox"
                id="upper-check"
                name="upper-check"
                class="form__input input-check input"
                checked
              />
            </div>
            <div class="form-group">
              <label for="lower-check">include lowercase</label>
              <input
                type="checkbox"
                id="lower-check"
                name="lower-check"
                class="form__input input-check input"
                checked
              />
            </div>
            <div class="form-group">
              <label for="num-check">include numbers</label>
              <input
                type="checkbox"
                id="num-check"
                name="num-check"
                class="form__input input-check input"
                checked
              />
            </div>
            <div class="form-group">
              <label for="symbol-check">include symbols</label>
              <input
                type="checkbox"
                id="symbol-check"
                name="symbol-check"
                class="form__input input-check input"
                checked
              />
            </div>
          </fieldset>
          <div class="form-controls">
            <button type="button" class="form__button generate-button button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
                focusable="false"
                class="button__icon key-icon icon"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"
                />
              </svg>
              <span class="button__text">generate password</span>
            </button>
          </div>
          <div class="form-group">
            <div class="form__indicator">
              <label
                for="strength-pass"
                class="form__label strength-label label"
                >password strength:
              </label>
              <span id="indicator-text" class="indicator__text">weak</span>
            </div>
            <meter
              aria-describedby="indicator-text"
              id="strength-pass"
              class="form__meter"
              min="0"
              max="100"
              high="80"
              low="50"
              optimum="100"
              value="0"
            ></meter>
          </div>
          <p class="sr-only" role="status" id="annoncer" aria-live="polite"></p>
        </form>
      </div>
    </main>
  </body>
</html>
